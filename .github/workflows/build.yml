# GitHub Actions recipe: builds GoProRenamer.exe on a Windows cloud machine.
# Save this in your repository as:  .github/workflows/build.yml
# Run it from the "Actions" tab -> "Build GoProRenamer" -> "Run workflow".
name: Build GoProRenamer

on:
  workflow_dispatch:        # lets you start the build with a button click

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1. Download your repository's files onto the cloud machine
      - uses: actions/checkout@v4

      # 2. Install Python (includes Tkinter, which the app needs)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install PyInstaller, the tool that turns the script into an .exe
      - run: python -m pip install pyinstaller

      # 4. Build one single .exe with no console window
      - run: python -m PyInstaller --onefile --windowed --name GoProRenamer gopro_renamer.py

      # 5. Make the finished .exe downloadable from the run page
      - uses: actions/upload-artifact@v4
        with:
          name: GoProRenamer
          path: dist/GoProRenamer.exe
